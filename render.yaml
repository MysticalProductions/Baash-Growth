# Render Blueprint Specification for BAASH GROWTH
# Automatically provisions PostgreSQL, Redis, and the NestJS Backend API
services:
  - type: web
    name: baash-backend
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: baash-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: baash-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: FRONTEND_URL
        value: https://your-site.netlify.app
      - key: SUPER_ADMIN_EMAIL
        value: admin@baash.in
      - key: SUPER_ADMIN_PASSWORD
        value: BaashAdmin@2026
      - key: SUPER_ADMIN_NAME
        value: "Baash Platform Admin"

  - type: redis
    name: baash-redis
    region: oregon
    plan: starter
    ipAllowList: []

databases:
  - name: baash-postgres
    region: oregon
    plan: starter
    databaseName: baash_growth
    user: baash_user

