version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: baash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baash_growth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - baash-network

  redis:
    image: redis:7-alpine
    container_name: baash-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - baash-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baash-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/baash_growth?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: baash_jwt_access_secret_key_change_in_production_2026
      JWT_EXPIRATION: 15m
      JWT_REFRESH_SECRET: baash_jwt_refresh_secret_key_change_in_production_2026
      JWT_REFRESH_EXPIRATION: 7d
      FRONTEND_URL: http://localhost:3000
      SUPER_ADMIN_EMAIL: admin@baash.in
      SUPER_ADMIN_PASSWORD: BaashAdmin@2026
      SUPER_ADMIN_NAME: "Baash Platform Admin"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - baash-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: baash-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - baash-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  baash-network:
    driver: bridge
